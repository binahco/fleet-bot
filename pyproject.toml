[project]
name = "llm-fleet-bot"
version = "0.1.0"
description = "fleet-bot: ciclo matutino de la flota — audit, evidencia y digest LLM (semana 9)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
fleet-bot = "fleet_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_bot"]

[dependency-groups]
dev = ["pytest>=8,<9"]